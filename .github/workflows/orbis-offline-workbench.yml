name: Orbis offline workbench
on:
  push:
    branches: [feature/m0-m4-completion]
    paths: [.github/workflows/orbis-offline-workbench.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bundle tracked project and installed Linux dependencies
        run: |
          tar --exclude='.git' --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' --exclude='*.eot' --exclude='*.typeface.json' --exclude='docs/screenshots' -czf /tmp/orbis-workbench.tgz src tests docs scripts node_modules package.json package-lock.json index.html svelte.config.js vite.config.ts tsconfig.json tsconfig.node.json playwright.config.ts README.md .gitignore
      - uses: actions/upload-artifact@v4
        with:
          name: orbis-offline-workbench
          path: /tmp/orbis-workbench.tgz
          retention-days: 1
