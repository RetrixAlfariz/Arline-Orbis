name: Orbis M0-M4 implementation verification
on:
  push:
    branches: [feature/m0-m4-completion]
    paths: [.github/workflows/orbis-apply-completion.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m0-m4-completion
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply checksum-verified implementation
        run: python .orbis-transfer/apply.py
      - name: Record implementation without temporary transport files
        run: |
          git rm -r .orbis-transfer
          git rm .github/workflows/orbis-offline-workbench.yml .github/workflows/orbis-apply-completion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement M0-M4 standalone cartography, caves and staged planetary systems'
          git push origin HEAD:feature/m0-m4-completion
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          ORBIS_E2E_PREVIEW: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-m4-browser-evidence
          path: test-results/
          retention-days: 7
